# The enrolment policy pack.
#
# src/policy_guard/ reads this and never imports `enrolment`. Everything the
# proxy knows about this domain — the upstream command, which tools return
# attacker-influenceable content, which policies to load — arrives here.
name: enrolment

# `python` is resolved at run time to the interpreter running the proxy
# itself (see `resolve_upstream_command` in `policy_guard/__main__.py`),
# never to whatever `python`/`python3` happens to be first on PATH -- the
# upstream needs this project's dependencies, which only that interpreter has.
upstream_command: python
upstream_args: [-m, enrolment.server]

policies: [allowlist, arg_validation, taint]

# Trust is per tool, not per server. The catalogue tools are labelled trusted
# on the supervisor's ruling (2026-09-23): the handbook is university-published
# text, and planted instructions there are not a credible threat. The one
# untrusted tool is the document the student uploaded -- written by anyone,
# read by the agent to help fill in a request, and the realistic injection
# channel. Reading it taints the run; see `side_effecting_tools`.
trust:
  search_subjects: trusted
  get_subject_details: trusted
  get_attachment: untrusted
  get_student_record: trusted
  check_prerequisites: trusted
  enrol: trusted
  drop: trusted
  submit_erequest: trusted
  get_study_plan: trusted
  preview_major_change: trusted
  get_session_options: trusted

# The tools the taint policy holds after an untrusted read. Named as the
# acting set on purpose: a tool left off is treated as a read.
side_effecting_tools: [enrol, drop, submit_erequest]

# Which tool argument carries the principal this task is scoped to. The generic
# layer knows a task has a bound principal; only the pack knows this domain
# calls it `student_id`. Argument validation will use this to reject a call that
# names a different one.
principal_argument: student_id

# Tools that legitimately take no `student_id` -- a catalogue search and a
# subject lookup have no student to bind to -- so calling them without one is
# not itself grounds for denial. A call to one of these naming the *wrong*
# student_id is still denied unconditionally; this only exempts the
# no-argument case. Every other tool stays enforced by default, including any
# added later and not listed here.
principal_exempt_tools: [search_subjects, get_subject_details]

# Import path to this domain's argument validators. `src/policy_guard/`
# resolves it without importing `enrolment` itself.
domain_rules: enrolment.policy_pack:build_validators

# Keyword arguments for that factory. This is the single source of truth for
# where the dataset lives. `students_path` in particular: `__main__.main`
# reads this same value and appends it as the upstream server's own
# `--students` argument, so the file the proxy's validators check a
# student's enrolment against and the file the upstream server actually
# mutates cannot diverge -- they are, by construction, the same path.
domain_rules_args:
  data_dir: data
  students_path: data/students.json
