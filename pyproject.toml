[project]
name = "mcp-policy-guard"
version = "0.0.1"
description = "Policy enforcement layer for MCP tool calls: defending LLM agents against prompt injection"
authors = [{ name = "Guanyu Lin" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # mcp 2.x, not 1.x: this project uses `MCPServer`, the `Client` facade and
    # `Tool.input_schema`, none of which the 1.x API has. `>=1.0` was a
    # reproducibility claim the project could not honour -- a resolver was free
    # to install a version the code cannot import.
    "mcp>=2.0,<3",
    # `mcp_types` ships as its own distribution (`mcp-types`), pulled in as a
    # dependency of `mcp` rather than bundled inside it. `tests/` imports it
    # directly, so it is declared here rather than relied on transitively.
    "mcp-types>=2.0,<3",
    # imported directly by `policy_guard/__main__.py` and by the tests; also a
    # dependency of `mcp`, but this project uses it in its own right.
    "anyio>=4.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    # The demonstration frontend (spec §8). FastAPI serves one static page and
    # three JSON endpoints; uvicorn runs it. Declared as ordinary dependencies
    # rather than an extra because the frontend is a listed deliverable, and an
    # extra nobody installs is a deliverable nobody can run.
    "fastapi>=0.110",
    "uvicorn>=0.27",
    # The demo reads documents the presenter drags onto the chat. pypdf pulls
    # the text out of a PDF; python-multipart is what FastAPI needs to accept
    # the upload at all (it was only ever installed transitively before).
    "pypdf>=4",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    # Only `python -m enrolment.build_documents` needs it: it writes the eight
    # shipped PDFs. The server never writes a PDF.
    "fpdf2>=2.7",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
anyio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
